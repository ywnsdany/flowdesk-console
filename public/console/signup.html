<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>تسجيل حساب جديد — كاشير اقفال</title>
  <link rel="stylesheet" href="/console/styles.css">
</head>
<body>
  <button class="theme-fab" onclick="window.toggleTheme()" aria-label="تبديل المظهر">🌗</button>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand-mark">
        <div class="logo">ك</div>
        <div class="name">كاشير اقفال<small>تقفيل يوميات المطاعم والكافيهات</small></div>
      </div>
      <h1>إنشاء حساب جديد</h1>
      <p class="muted" style="margin-bottom: 24px;">سجّل كمحاسب جديد. كل حساب يدير بياناته بشكل مستقل.</p>
      <form id="form">
        <div class="form-row">
          <label for="email">البريد الإلكتروني</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="form-row">
          <label for="password">كلمة المرور</label>
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="١٠ حروف على الأقل" minlength="10" required>
          <div class="hint">استخدم ١٠ حروف على الأقل، يفضّل خليط من حروف وأرقام.</div>
        </div>
        <button type="submit" id="submit" class="btn full lg">إنشاء الحساب</button>
      </form>
      <div class="auth-switch">عندك حساب؟ <a href="/console/">سجّل دخول</a></div>
    </div>
  </div>

  <script src="/console/app.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit');
      btn.disabled = true; btn.textContent = '...';
      try {
        await window.api('/api/auth/signup', {
          method: 'POST',
          body: {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          },
        });
        location.href = '/console/dashboard';
      } catch (err) {
        window.toast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'إنشاء الحساب';
      }
    });
  </script>
</body>
</html>
