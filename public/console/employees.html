<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>الموظفين — كاشير اقفال</title>
  <link rel="stylesheet" href="/console/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main>
      <div class="page-head">
        <div class="titles">
          <h1>الموظفين</h1>
          <div class="muted">حسابات الموظفين، فروعهم، عهدتهم.</div>
        </div>
        <button class="btn" onclick="openCreate()">+ موظف جديد</button>
      </div>

      <div class="card">
        <div id="list"></div>
      </div>
    </main>
  </div>

  <script src="/console/app.js"></script>
  <script>
    let BRANCHES = [];

    async function loadBranches() {
      const r = await window.api('/api/branches');
      BRANCHES = r.items || [];
    }

    async function load() {
      const root = document.getElementById('list');
      root.innerHTML = '<div class="muted" style="padding: 12px;">جاري التحميل...</div>';
      try {
        const r = await window.api('/api/employees');
        if (!r.items.length) {
          root.innerHTML = '<div class="empty"><div class="icon">☻</div><div class="big">لا يوجد موظفين</div>أضف موظف ليسجّل دخوله ويرفع التقفيلات.</div>';
          return;
        }
        const ROLE_LABEL = { cashier: 'كاشير', collector: 'محصّل' };
        const ROLE_ICON  = { cashier: '🧾', collector: '💰' };
        const rows = r.items.map((e) => {
          const branches = (e.branches || []).map((b) =>
            `<span class="tag">${window.escapeHtml(b.brand_name)} / ${window.escapeHtml(b.name)}</span>`
          ).join(' ');
          const isCollector = e.role === 'collector';
          const balance = isCollector ? e.wallet_balance_halalas : e.custody_balance_halalas;
          return `
            <tr>
              <td>
                <strong>${window.escapeHtml(e.name)}</strong>
                <div class="muted" style="font-size:12px;">@${window.escapeHtml(e.username || '—')}</div>
              </td>
              <td><span class="tag">${ROLE_ICON[e.role] || '👤'} ${ROLE_LABEL[e.role] || e.role}</span></td>
              <td>${branches || '<span class="dim">—</span>'}</td>
              <td class="num"><strong class="${window.amountClass(balance)}">${window.SAR(balance)}</strong></td>
              <td><span class="pill ${e.status}">${e.status === 'active' ? 'مفعّل' : 'معطّل'}</span></td>
              <td class="shrink">
                <div class="row">
                  <button class="btn-icon" data-pwd="${e.id}" data-name="${window.escapeHtml(e.name)}" title="تغيير الباسورد">🔑</button>
                  <button class="btn-icon" data-toggle="${e.id}" data-status="${e.status}" title="${e.status === 'active' ? 'تعطيل' : 'تفعيل'}">${e.status === 'active' ? '⏸' : '▶'}</button>
                  <button class="btn-icon" data-edit='${e.id}|${window.escapeHtml(e.name)}|${(e.branches||[]).map(b=>b.id).join(',')}' title="تعديل">✎</button>
                  <button class="btn-icon danger" data-del-id="${e.id}" data-del-name="${window.escapeHtml(e.name)}" title="حذف">×</button>
                </div>
              </td>
            </tr>`;
        }).join('');
        root.innerHTML = `
          <table>
            <thead><tr>
              <th>الموظف</th><th>الدور</th><th>الفروع</th>
              <th class="num">الرصيد</th><th>الحالة</th><th></th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>`;
        root.querySelectorAll('[data-pwd]').forEach((el) => {
          el.onclick = () => resetPwd(el.getAttribute('data-pwd'), el.getAttribute('data-name'));
        });
        root.querySelectorAll('[data-toggle]').forEach((el) => {
          el.onclick = () => toggleStatus(el.getAttribute('data-toggle'), el.getAttribute('data-status'));
        });
        root.querySelectorAll('[data-edit]').forEach((el) => {
          el.onclick = () => {
            const [id, name, branchCsv] = el.getAttribute('data-edit').split('|');
            openForm({ id, name, branchIds: branchCsv ? branchCsv.split(',').filter(Boolean) : [] });
          };
        });
        root.querySelectorAll('[data-del-id]').forEach((el) => {
          el.onclick = () => del(el.getAttribute('data-del-id'), el.getAttribute('data-del-name'));
        });
      } catch (err) {
        window.toast(err.message, 'error');
      }
    }

    function openCreate() { openForm(); }

    function openForm(existing) {
      if (!BRANCHES.length && !existing) return window.toast('أنشئ فرعاً أولاً', 'error');
      const back = document.createElement('div');
      back.className = 'modal-backdrop';
      const branchChecks = BRANCHES.map((b) => {
        const checked = existing?.branchIds?.includes(b.id) ? 'checked' : '';
        return `<label class="check" style="display:flex;margin-bottom:8px;">
          <input type="checkbox" data-branch="${b.id}" ${checked}>
          <span>${window.escapeHtml(b.brand_name)} / ${window.escapeHtml(b.name)}</span>
        </label>`;
      }).join('');
      back.innerHTML = `
        <div class="modal" style="max-width:520px;">
          <div class="modal-head">${existing ? 'تعديل موظف' : 'موظف جديد'}</div>
          <div class="modal-body">
            <div class="form-row">
              <label>الاسم الكامل</label>
              <input id="m-name" type="text" placeholder="مثلاً: أحمد العتيبي">
            </div>
            ${existing ? '' : `
            <div class="form-row">
              <label>الدور</label>
              <select id="m-role">
                <option value="cashier" selected>🧾 كاشير — يقفل الشفت اليومي</option>
                <option value="collector">💰 محصّل — يستلم كاش من الفروع ويسجّل مصاريفه</option>
              </select>
            </div>
            <div class="form-row">
              <label>اسم المستخدم (للدخول)</label>
              <input id="m-username" type="text" placeholder="ahmed01" autocomplete="off" pattern="[a-zA-Z0-9_.\\-]{3,32}" required>
              <div class="hint">٣–٣٢ حرف، حروف إنجليزية/أرقام/_-.</div>
            </div>
            <div class="form-row">
              <label>كلمة المرور</label>
              <input id="m-password" type="text" placeholder="٦ أحرف على الأقل" minlength="6" required>
              <div class="hint">احفظها وأرسلها للموظف.</div>
            </div>
            <div class="form-row" id="custody-row">
              <label>عهدة افتتاحية (ر.س) — للكاشير فقط</label>
              <input id="m-custody" type="text" inputmode="decimal" placeholder="0.00" value="0">
            </div>`}
            <div class="form-row">
              <label id="m-branches-label">الفروع المسموح بها</label>
              <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:12px;">
                ${branchChecks || '<div class="muted">لا توجد فروع</div>'}
              </div>
              <div class="hint" id="m-branches-hint">يمكن للموظف رفع تقفيلات لأي فرع مختار.</div>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn ghost" data-cancel>إلغاء</button>
            <button class="btn" data-ok>${existing ? 'حفظ' : 'إنشاء'}</button>
          </div>
        </div>`;
      document.body.appendChild(back);
      if (existing) back.querySelector('#m-name').value = existing.name || '';

      // Dynamic label + hint based on role + hide custody for collector.
      const roleSel    = back.querySelector('#m-role');
      const labelEl    = back.querySelector('#m-branches-label');
      const hintEl     = back.querySelector('#m-branches-hint');
      const custodyRow = back.querySelector('#custody-row');
      function applyRoleUI() {
        const role = roleSel ? roleSel.value : 'cashier';
        if (labelEl) {
          labelEl.textContent = role === 'collector'
            ? 'الفروع المسموح له بالتحصيل منها'
            : 'الفروع المسموح بها';
        }
        if (hintEl) {
          hintEl.textContent = role === 'collector'
            ? 'يستلم المحصّل الكاش من أي فرع مختار.'
            : 'يمكن للكاشير رفع تقفيلات لأي فرع مختار.';
        }
        if (custodyRow) {
          custodyRow.style.display = role === 'collector' ? 'none' : '';
        }
      }
      if (roleSel) roleSel.addEventListener('change', applyRoleUI);
      applyRoleUI();

      const close = () => back.remove();
      back.addEventListener('click', (e) => { if (e.target === back) close(); });
      back.querySelector('[data-cancel]').onclick = close;
      back.querySelector('[data-ok]').onclick = async () => {
        const name = back.querySelector('#m-name').value.trim();
        if (!name) return window.toast('الاسم مطلوب', 'error');
        const branchIds = Array.from(back.querySelectorAll('[data-branch]:checked')).map((c) => c.getAttribute('data-branch'));
        if (!branchIds.length) return window.toast('اختر فرعاً واحداً على الأقل', 'error');
        try {
          if (existing) {
            await window.api(`/api/employees/${existing.id}`, {
              method: 'PATCH',
              body: { name, branch_ids: branchIds },
            });
          } else {
            const username = back.querySelector('#m-username').value.trim();
            const password = back.querySelector('#m-password').value;
            const custody_balance = back.querySelector('#m-custody').value;
            const role = back.querySelector('#m-role').value;
            await window.api('/api/employees', {
              method: 'POST',
              body: { name, username, password, branch_ids: branchIds, custody_balance, role },
            });
          }
          window.toast(existing ? 'تم الحفظ' : 'تم الإنشاء', 'success');
          close(); load();
        } catch (err) { window.toast(err.message, 'error'); }
      };
    }

    function resetPwd(id, name) {
      const back = document.createElement('div');
      back.className = 'modal-backdrop';
      back.innerHTML = `
        <div class="modal">
          <div class="modal-head">تغيير كلمة مرور — ${name}</div>
          <div class="modal-body">
            <div class="form-row">
              <label>كلمة المرور الجديدة</label>
              <input id="m-pwd" type="text" placeholder="٦ أحرف على الأقل" minlength="6">
              <div class="hint">احفظها وأرسلها للموظف. الجلسات السابقة تستمر للمستخدم المسجّل حالياً.</div>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn ghost" data-cancel>إلغاء</button>
            <button class="btn" data-ok>حفظ</button>
          </div>
        </div>`;
      document.body.appendChild(back);
      const close = () => back.remove();
      back.addEventListener('click', (e) => { if (e.target === back) close(); });
      back.querySelector('[data-cancel]').onclick = close;
      back.querySelector('[data-ok]').onclick = async () => {
        const password = back.querySelector('#m-pwd').value;
        if (password.length < 6) return window.toast('٦ أحرف على الأقل', 'error');
        try {
          await window.api(`/api/employees/${id}/reset-password`, {
            method: 'POST',
            body: { password },
          });
          window.toast('تم تغيير الباسورد', 'success');
          close();
        } catch (err) { window.toast(err.message, 'error'); }
      };
    }

    async function toggleStatus(id, currentStatus) {
      const next = currentStatus === 'active' ? 'disabled' : 'active';
      try {
        await window.api(`/api/employees/${id}`, { method: 'PATCH', body: { status: next } });
        window.toast('تم', 'success');
        load();
      } catch (err) { window.toast(err.message, 'error'); }
    }

    async function del(id, name) {
      const ok = await window.confirmDialog({
        title: 'حذف موظف',
        body: `هل أنت متأكد من حذف "${name}"؟ تقفيلاته السابقة تبقى محفوظة.`,
        confirmLabel: 'حذف', danger: true,
      });
      if (!ok) return;
      try {
        await window.api(`/api/employees/${id}`, { method: 'DELETE' });
        window.toast('تم الحذف', 'success');
        load();
      } catch (err) { window.toast(err.message, 'error'); }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await loadBranches();
      load();
    });
  </script>
</body>
</html>
