<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>تسجيل الدخول — إقفال</title>
  <link rel="stylesheet" href="/console/styles.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0f1320" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fafbfc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="إقفال">
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}</script>

</head>
<body>
  <button class="theme-fab" onclick="window.toggleTheme()" aria-label="تبديل المظهر">🌗</button>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand-mark">
        <div class="logo">إ</div>
        <div class="name">إقفال<small>تقفيل يوميات المطاعم والكافيهات</small></div>
      </div>
      <h1>تسجيل الدخول</h1>
      <p class="muted" style="margin-bottom: 24px;">أدخل اسم المستخدم وكلمة المرور.</p>
      <form id="form">
        <div class="form-row">
          <label for="username">اسم المستخدم</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="username" required autofocus>
        </div>
        <div class="form-row">
          <label for="password">كلمة المرور</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <button type="submit" id="submit" class="btn full lg">دخول</button>
      </form>
    </div>
  </div>

  <script src="/console/app.js"></script>
  <script>
    function pathFor(role) {
      if (role === 'employee')  return '/staff/';
      if (role === 'collector') return '/collector/';
      return '/console/dashboard';
    }
    (async () => {
      try {
        const me = await window.api('/api/auth/me');
        if (me.authenticated) location.href = pathFor(me.role);
      } catch {}
    })();

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit');
      btn.disabled = true; btn.textContent = '...';
      try {
        const r = await window.api('/api/auth/login', {
          method: 'POST',
          body: {
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          },
        });
        location.href = pathFor(r.role);
      } catch (err) {
        window.toast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'دخول';
      }
    });
  </script>
</body>
</html>
