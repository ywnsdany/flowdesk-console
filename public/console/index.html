<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>تسجيل الدخول — كاشير اقفال</title>
  <link rel="stylesheet" href="/console/styles.css">
</head>
<body>
  <button class="theme-fab" onclick="window.toggleTheme()" aria-label="تبديل المظهر">🌗</button>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand-mark">
        <div class="logo">ك</div>
        <div class="name">كاشير اقفال<small>تقفيل يوميات المطاعم والكافيهات</small></div>
      </div>
      <h1>تسجيل الدخول</h1>
      <p class="muted" style="margin-bottom: 24px;">للمحاسبين: استخدم البريد. للموظفين: استخدم اسم المستخدم.</p>
      <form id="form">
        <div class="form-row">
          <label for="identifier">البريد أو اسم المستخدم</label>
          <input id="identifier" name="identifier" type="text" autocomplete="username" placeholder="you@example.com  أو  ahmed01" required>
        </div>
        <div class="form-row">
          <label for="password">كلمة المرور</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <button type="submit" id="submit" class="btn full lg">دخول</button>
      </form>
      <div class="auth-switch">حساب محاسب جديد؟ <a href="/console/signup">سجّل الآن</a></div>
    </div>
  </div>

  <script src="/console/app.js"></script>
  <script>
    (async () => {
      try {
        const me = await window.api('/api/auth/me');
        if (me.authenticated) {
          location.href = me.role === 'employee' ? '/staff/' : '/console/dashboard';
        }
      } catch {}
    })();

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit');
      btn.disabled = true; btn.textContent = '...';
      try {
        const id = document.getElementById('identifier').value.trim();
        const r = await window.api('/api/auth/login', {
          method: 'POST',
          body: {
            // Send both keys; server picks whichever exists.
            email: id.includes('@') ? id : undefined,
            username: id.includes('@') ? undefined : id,
            password: document.getElementById('password').value,
          },
        });
        location.href = r.role === 'employee' ? '/staff/' : '/console/dashboard';
      } catch (err) {
        window.toast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'دخول';
      }
    });
  </script>
</body>
</html>
