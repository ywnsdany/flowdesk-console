<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#6d4dff">
  <title>محفظتي — إقفال</title>
  <link rel="stylesheet" href="/collector/collector.css">
</head>
<body>
  <div class="toolbar">
    <button class="icon-btn" id="theme-toggle" aria-label="تبديل المظهر">🌗</button>
    <button class="icon-btn danger" id="logout-btn" aria-label="خروج">↶</button>
  </div>

  <div class="shell">
    <div class="brand">
      <div class="logo">إ</div>
      <div class="who">
        <h1 id="welcome-name">جاري التحميل...</h1>
        <small>خزنة المشتريات</small>
      </div>
    </div>

    <!-- Hero balance card -->
    <div class="balance-card">
      <div class="label">رصيدي الحالي</div>
      <div>
        <span class="value" id="balance-value">—</span>
        <span class="currency">ر.س</span>
      </div>
      <div class="sub">
        <div>
          <div class="k">استلمت من المدير</div>
          <div class="v num" id="total-topup">—</div>
        </div>
        <div>
          <div class="k">إجمالي اللي صرفته</div>
          <div class="v num" id="total-spent">—</div>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs" style="grid-template-columns: 1fr 1fr;">
      <button class="tab active" data-tab="spend">🛒 مشتريات</button>
      <button class="tab"        data-tab="history">📋 السجل</button>
    </div>

    <!-- Tab 1: Add a purchase -->
    <section id="tab-spend">
      <div class="card">
        <h2><span class="accent"></span> تسجيل مشتريات</h2>
        <form id="form-spend">
          <div class="field">
            <label>المبلغ (ر.س)</label>
            <input type="text" name="amount" inputmode="decimal" placeholder="0.00" required>
          </div>
          <div class="field">
            <label>نوع المشتريات</label>
            <select name="category" id="spend-category">
              <option value="supplies">📦 مستلزمات</option>
              <option value="equipment">🔌 معدات</option>
              <option value="inventory">🍽 بضاعة</option>
              <option value="fuel">⛽ بنزين</option>
              <option value="food">🍱 طعام</option>
              <option value="maintenance">🔧 صيانة</option>
              <option value="transport">🚗 مواصلات</option>
              <option value="other">📌 أخرى</option>
            </select>
          </div>
          <div class="field">
            <label>المكان (من وين اشتريت)</label>
            <input type="text" name="place" placeholder="مثلاً: بقالة أبو علي">
          </div>
          <div class="field" style="margin-bottom: 0;">
            <label>وش اشتريت / ليش</label>
            <input type="text" name="reason" placeholder="مثلاً: ٥ كراتين ماء للفرع">
          </div>
          <button type="submit" class="btn warn" id="btn-spend">🛒 تسجيل</button>
        </form>
      </div>
    </section>

    <!-- Tab 2: History -->
    <section id="tab-history" hidden>
      <div class="card">
        <div class="row-head">
          <h2><span class="accent"></span> آخر العمليات</h2>
          <div class="filter-pills">
            <button class="pill-btn active" data-filter="all">الكل</button>
            <button class="pill-btn" data-filter="topup">شحن</button>
            <button class="pill-btn" data-filter="purchase">مشتريات</button>
          </div>
        </div>
        <div id="history-list">
          <div class="empty"><div class="ico">⏳</div><div class="big">جاري التحميل...</div></div>
        </div>
      </div>
    </section>
  </div>

  <script src="/collector/collector.js"></script>
</body>
</html>
